name: Library Management CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f Dockerfile
          test -f compose.yaml
          echo "All required project files exist."

      - name: Build Docker image
        run: docker build -t library-management-app .

      - name: Test Docker container
        run: |
          docker run -d --name library-test -p 8081:80 library-management-app
          sleep 3
          curl --fail http://localhost:8081
          docker stop library-test
          docker rm library-test
